name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    formatting:
        name: Formatação
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Instalar dependências da raiz
              run: npm ci --ignore-scripts

            - name: Verificar formatação
              run: npm run format:check

    backend:
        name: Backend
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: quest_log_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d quest_log_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quest_log_test
            JWT_SECRET: chave_secreta_exclusiva_para_testes_na_ci
            RAWG_API_KEY: chave_ficticia_para_testes
            FRONTEND_URL: http://localhost:5173

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Instalar dependências
              run: npm ci

            - name: Gerar Prisma Client
              run: npx prisma generate

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Typecheck dos testes
              run: npm run typecheck:tests

            - name: Build
              run: npm run build

            - name: Aplicar migrations no banco de testes
              run: npm run test:migrate

            - name: Executar testes com coverage
              run: npm run test:coverage

            - name: Publicar relatório de coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
                  if-no-files-found: ignore
                  retention-days: 7

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Instalar dependências
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Typecheck dos testes
              run: npm run typecheck:tests

            - name: Build
              run: npm run build

            - name: Executar testes com coverage
              run: npm run test:coverage
              env:
                  VITE_API_URL: http://localhost:3999

            - name: Publicar relatório de coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  if-no-files-found: ignore
                  retention-days: 7

    e2e:
        name: E2E
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: quest_log_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d quest_log_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

            mailpit:
                image: axllent/mailpit:v1.29.4
                ports:
                    - 1025:1025
                    - 8025:8025
                options: >-
                    --health-cmd "/mailpit readyz"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quest_log_e2e

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      backend/package-lock.json
                      frontend/package-lock.json

            - name: Instalar dependências da raiz
              run: npm ci --ignore-scripts

            - name: Instalar dependências do backend
              run: npm ci --prefix backend

            - name: Instalar dependências do frontend
              run: npm ci --prefix frontend

            - name: Preparar ambiente E2E
              run: |
                  cat > backend/.env.e2e <<EOF
                  DATABASE_URL=${DATABASE_URL}
                  NODE_ENV=${NODE_ENV}
                  PORT_LOCAL=3000
                  FRONTEND_URL=http://localhost:5173
                  JWT_SECRET=chave_secreta_exclusiva_para_e2e_na_ci
                  RAWG_API_KEY=chave_ficticia_para_e2e
                  EMAIL_PROVIDER=smtp
                  SMTP_HOST=127.0.0.1
                  SMTP_PORT=1025
                  SMTP_FROM="QuestLog E2E <noreply@questlog.test>"
                  EOF

                  cat > frontend/.env.e2e <<EOF
                  VITE_API_URL=http://localhost:3000
                  EOF

            - name: Gerar Prisma Client
              working-directory: backend
              run: npx prisma generate

            - name: Typecheck dos E2E
              working-directory: backend
              run: npx tsc --project ../e2e/tsconfig.json --noEmit

            - name: Aplicar migrations no banco E2E
              working-directory: backend
              run: npx prisma migrate deploy

            - name: Instalar Chromium e dependências do sistema
              run: npx playwright install --with-deps chromium

            - name: Executar E2E
              run: npx playwright test

            - name: Publicar relatório e resultados dos E2E
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    deploy:
        name: Deploy de produção no Render
        needs: [formatting, backend, frontend, e2e]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            deployments: write
        concurrency:
            group: render-production
            cancel-in-progress: false

        steps:
            - name: Publicar e acompanhar deploy
              uses: JorgeLNJunior/render-deploy@32c271db15b8b87b91cec4bb2cc094cc7c0f98a2 # v1.5.0
              with:
                  service_id: ${{ secrets.RENDER_SERVICE_ID }}
                  api_key: ${{ secrets.RENDER_API_KEY }}
                  ref: ${{ github.sha }}
                  wait_deploy: true
                  github_deployment: true
                  deployment_environment: production
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    deploy-sandbox:
        name: Deploy do sandbox no Render
        needs: [formatting, backend, frontend, e2e]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            deployments: write
        concurrency:
            group: render-sandbox
            cancel-in-progress: false

        steps:
            - name: Publicar e acompanhar deploy do sandbox
              uses: JorgeLNJunior/render-deploy@32c271db15b8b87b91cec4bb2cc094cc7c0f98a2 # v1.5.0
              with:
                  service_id: ${{ secrets.RENDER_SANDBOX_SERVICE_ID }}
                  api_key: ${{ secrets.RENDER_API_KEY }}
                  ref: ${{ github.sha }}
                  wait_deploy: true
                  github_deployment: true
                  deployment_environment: sandbox
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    deploy-comment:
        name: Resultado dos deploys no PR
        needs: [deploy, deploy-sandbox]
        if: >-
            always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            (needs.deploy.result != 'skipped' || needs['deploy-sandbox'].result != 'skipped')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Publicar ou atualizar comentário
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  PRODUCTION_DEPLOY_RESULT: ${{ needs.deploy.result }}
                  SANDBOX_DEPLOY_RESULT: ${{ needs['deploy-sandbox'].result }}
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const pullRequests = await github.paginate(
                          github.rest.repos.listPullRequestsAssociatedWithCommit,
                          { owner, repo, commit_sha: context.sha, per_page: 100 },
                      );
                      const mergedPullRequests = pullRequests.filter(
                          (pr) => pr.merged_at && pr.base.ref === 'main',
                      );

                      if (!mergedPullRequests.length) {
                          core.info('Nenhum PR mergeado associado ao commit; resultado disponível na execução da CI.');
                          return;
                      }

                      const marker = '<!-- questlog-render-deploy -->';
                      const statuses = {
                          success: '✅ Concluído',
                          failure: '❌ Falhou',
                          cancelled: '⚠️ Acompanhamento cancelado; confira o Render',
                          skipped: '⏭️ Não executado',
                      };
                      const production = statuses[process.env.PRODUCTION_DEPLOY_RESULT] ?? '⚠️ Resultado indisponível';
                      const sandbox = statuses[process.env.SANDBOX_DEPLOY_RESULT] ?? '⚠️ Resultado indisponível';
                      const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
                      const body = [
                          marker,
                          '### Deploys do backend no Render',
                          '',
                          '| Ambiente | Resultado |',
                          '| --- | --- |',
                          `| Produção | ${production} |`,
                          `| Sandbox | ${sandbox} |`,
                          '',
                          `Commit: \`${context.sha.slice(0, 7)}\``,
                          '',
                          `[Ver detalhes da execução](${runUrl})`,
                      ].join('\n');

                      for (const pr of mergedPullRequests) {
                          const comments = await github.paginate(
                              github.rest.issues.listComments,
                              { owner, repo, issue_number: pr.number, per_page: 100 },
                          );
                          const existing = comments.find(
                              (comment) => comment.user?.login === 'github-actions[bot]' &&
                                  comment.body?.includes(marker),
                          );

                          if (existing) {
                              await github.rest.issues.updateComment({
                                  owner, repo, comment_id: existing.id, body,
                              });
                          } else {
                              await github.rest.issues.createComment({
                                  owner, repo, issue_number: pr.number, body,
                              });
                          }
                      }
