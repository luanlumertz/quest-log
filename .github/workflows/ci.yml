name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    formatting:
        name: Formatação
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Instalar dependências da raiz
              run: npm ci --ignore-scripts

            - name: Verificar formatação
              run: npm run format:check

    backend:
        name: Backend
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: quest_log_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d quest_log_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quest_log_test
            JWT_SECRET: chave_secreta_exclusiva_para_testes_na_ci
            RAWG_API_KEY: chave_ficticia_para_testes
            FRONTEND_URL: http://localhost:5173

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Instalar dependências
              run: npm ci

            - name: Gerar Prisma Client
              run: npx prisma generate

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Typecheck dos testes
              run: npm run typecheck:tests

            - name: Build
              run: npm run build

            - name: Aplicar migrations no banco de testes
              run: npm run test:migrate

            - name: Executar testes com coverage
              run: npm run test:coverage

            - name: Publicar relatório de coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
                  if-no-files-found: ignore
                  retention-days: 7

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Instalar dependências
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Typecheck dos testes
              run: npm run typecheck:tests

            - name: Build
              run: npm run build

            - name: Executar testes com coverage
              run: npm run test:coverage
              env:
                  VITE_API_URL: http://localhost:3999

            - name: Publicar relatório de coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  if-no-files-found: ignore
                  retention-days: 7
